name: Update TryHackMe Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Generate TryHackMe badge
        uses: p4p1s/tryhackme-badge@main
        with:
          username: therealestpokemon

      - name: Commit badge
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update TryHackMe stats"
          add: "assets/tryhackme.svg"
